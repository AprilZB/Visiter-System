server:
  port: 8096
  servlet:
    context-path: /

spring:
  application:
    name: visitor-backend
  sql:
    init:
      mode: always # 启动自动在 MySQL 中执行建表和初始数据
      schema-locations: classpath:db/schema.sql
  datasource:
    # 本地开发/测试 MySQL 数据库 (账号密码: root / admin@123)
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/visitor_system_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:admin@123}

# 组织架构主库 (10.11.100.202 只读库)
master-datasource:
  url: jdbc:mysql://10.11.100.202:3306/aphrdb?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
  username: root
  password: Mtdb@123


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 系统安全与算法配置
visitor:
  jwt:
    secret: maitong-visitor-system-secret-key-2026-encrypt-256bits
    expiration-ms: 86400000 # 24小时
  aes:
    key: MTMTMTMTMTMTMTMTMTMTMTMTMTMTMTMT # 32字节 AES-256 密钥
  ocr:
    default-url: http://10.11.100.238:8081/ocr
  dingtalk:
    app-key: ""
    app-secret: ""
    corp-id: ""
